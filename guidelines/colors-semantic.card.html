<!-- @dsCard group="Colors" viewport="700x180" subtitle="Text + surface semantic tokens on page background" name="Semantic" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--near-black);font-family:var(--font-body);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.chip{width:20px;height:20px;border-radius:5px;flex:none}
span{color:var(--cream);font-size:13px}
</style>
<div class="row"><div class="chip" style="background:var(--bg-surface);border:1px solid var(--border-subtle)"></div><span>--bg-surface (card background)</span></div>
<div class="row"><div class="chip" style="background:var(--text-primary)"></div><span>--text-primary (cream)</span></div>
<div class="row"><div class="chip" style="background:var(--text-secondary)"></div><span>--text-secondary (dimmed cream)</span></div>
<div class="row"><div class="chip" style="background:var(--accent)"></div><span>--accent (lime — CTAs, active states only)</span></div>
