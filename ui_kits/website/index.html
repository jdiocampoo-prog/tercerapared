<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>*{margin:0;box-sizing:border-box}body{background:var(--near-black)}a{color:var(--lime)}a:hover{color:var(--lime-dim)}</style>
</head><body>
<div id="root"></div>
<script src="SiteHeader.jsx" type="text/babel"></script>
<script src="Hero.jsx" type="text/babel"></script>
<script src="ContentFeed.jsx" type="text/babel"></script>
<script src="RankingsPanel.jsx" type="text/babel"></script>
<script src="SiteFooter.jsx" type="text/babel"></script>
<script type="text/babel">
const { useState } = React;
function ToastBanner({ show, message }) {
  return (
    <div style={{
      position: "fixed", bottom: "32px", left: "50%", transform: `translateX(-50%) translateY(${show ? "0" : "20px"})`,
      opacity: show ? 1 : 0, transition: "all 220ms cubic-bezier(.4,0,.2,1)", pointerEvents: "none",
      background: "var(--lime)", color: "var(--near-black)", fontFamily: "var(--font-body)", fontWeight: 700,
      fontSize: "14px", padding: "14px 28px", borderRadius: "var(--radius-pill)", boxShadow: "var(--shadow-pop)", zIndex: 10,
    }}>{message}</div>
  );
}
function App() {
  const [joined, setJoined] = useState(false);
  return (
    <div onClickCapture={(e) => { if (e.target.tagName === "BUTTON" && e.target.textContent.includes("Únete")) setJoined(true); }}>
      <SiteHeader active="inicio" />
      <Hero />
      <ContentFeed />
      <RankingsPanel />
      <SiteFooter />
      <ToastBanner show={joined} message="¡Bienvenido a la comunidad! Revisa tu correo." />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
